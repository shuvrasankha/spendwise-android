name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and checks the wrapper jar is genuine
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The real google-services.json is never committed. The build only needs a file of the right shape;
      # the APK from CI can't sign in, which is fine since nothing installs it.
      - name: Placeholder google-services.json
        run: cp .github/ci/google-services.placeholder.json app/google-services.json

      - name: Build, unit tests, lint
        run: ./gradlew assembleDebug testPlayDebugUnitTest lint --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            baselineprofile/build/reports/
          retention-days: 14
          if-no-files-found: ignore
