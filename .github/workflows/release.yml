name: Release

# Push a version tag to publish (see README › Release):
#   git tag -a v1.6.7 --cleanup=verbatim -F notes.md && git push origin v1.6.7
# The tag's message becomes the release notes; a lightweight tag gets GitHub's generated notes.
# --cleanup=verbatim keeps Markdown headings, which git would otherwise drop as # comments.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # The in-app updater compares the tag with the installed versionName, so they must agree
      - name: Tag matches versionName
        run: |
          name=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$name" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match versionName $name in app/build.gradle.kts"
            exit 1
          fi

      # Secrets → the files the build reads. Nothing here is printed or uploaded.
      - name: Signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD GOOGLE_SERVICES_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see README › Release)"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > upload.jks
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > keystore.properties

      - name: Build APK and bundle
        run: ./gradlew assembleRelease bundleRelease

      # Never publish a debug-signed APK: users couldn't install the next update over it
      - name: Check the signer
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$certs" | grep -E "DN|SHA-256"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is debug-signed"
            exit 1
          fi

      # The in-app updater downloads the first .apk asset, by this name since v1.6.4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SpendWise.apk
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # Only an annotated tag has a message; a lightweight one would give the commit's
          : > notes.md
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            # The raw message (after the tag header), less any signature
            git cat-file tag "$TAG" | sed '1,/^$/d' | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----/,$d' > notes.md
          fi
          if grep -q '[^[:space:]]' notes.md; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" SpendWise.apk --title "SpendWise $TAG" "${notes[@]}"

      # The Play bundle, kept with the run (not on the release, so the updater only sees the APK)
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.TAG }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove secrets from the runner
        if: always()
        run: rm -f upload.jks keystore.properties app/google-services.json
